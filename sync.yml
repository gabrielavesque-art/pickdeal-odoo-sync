name: Sync Odoo Pipeline

on:
  schedule:
    - cron: "0 * * * *"   # toutes les heures
  workflow_dispatch:        # bouton "Run workflow" manuel dans l'onglet Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python sync_pipeline.py

      - name: Commit updated snapshot
        run: |
          git config user.name "odoo-sync-bot"
          git config user.email "odoo-sync-bot@users.noreply.github.com"
          git add data/pipeline.json
          git diff --staged --quiet || git commit -m "Sync pipeline snapshot"
          git push
